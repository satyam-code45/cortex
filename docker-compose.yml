services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cortex-db
    ports:
      # The host port is overridable so this can coexist with another project's
      # Postgres already holding 5432. Default unchanged; set POSTGRES_PORT (and
      # the port in DATABASE_URL / TEST_DATABASE_URL) to move it.
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    volumes:
      - cortex_pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cortex_pgdata:
