version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        # Emit a Querier interface so shared run-lifecycle helpers accept
        # either the pool-backed *Queries or a transaction-scoped one; the
        # River worker reuses the same helpers as the HTTP handler.
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        # Nullable columns become *string / *int32 instead of pgtype wrappers.
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "UUID"
              import: "github.com/google/uuid"
              pointer: true
